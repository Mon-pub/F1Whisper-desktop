name: F1Whisper Desktop Release

# Cut a public F1Whisper Desktop (custom-onprem) release by pushing a version tag, e.g.:
#
#     git tag v2.0-beta66-f1.4 && git push origin refs/tags/v2.0-beta66-f1.4
#
# This workflow only verifies the release metadata, calls `build.yml` (the ONLY home of every
# build/validate job and every toolchain pin), and publishes what that run uploaded: a portable
# archive per platform (Linux x64, Windows x64), a combined `SHA256SUMS`, and a GitHub Release for
# the tag. It contains no build steps and no toolchain pins; change those in `build.yml` so the
# release can never ship something a test build (push a `ci/**` branch) did not prove.
#
# The release binaries embed NO server URL: the example config carries only a
# placeholder OnPrem host. Enter the F1Whisper service activation credentials during
# onboarding to connect the app to the service.
#
# Third-party actions are pinned to a commit SHA (the trailing `# vX.Y.Z` is the human-readable tag).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Release-metadata gate. Runs first and cheaply: a malformed or metadata-
  # inconsistent tag stops the pipeline before any build.
  # ---------------------------------------------------------------------------
  verify-release-metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate tag syntax and package metadata
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Exact F1Whisper Desktop release tag syntax: vX.Y-betaN-f1.N
          re='^v[0-9]+\.[0-9]+-beta[0-9]+-f1\.[0-9]+$'
          if [[ ! "${tag}" =~ ${re} ]]; then
            echo "::error::Tag '${tag}' does not match the required release tag syntax vX.Y-betaN-f1.N"
            exit 1
          fi

          # Cross-check the tag against committed package metadata so a stale or forgotten version /
          # f1Release bump fails here rather than shipping a mislabeled artifact.
          version="$(jq -r .version apps/desktop/package.json)"
          f1release="$(jq -r .f1Release apps/desktop/package.json)"
          expected="v${version}-f1.${f1release}"
          if [[ "${tag}" != "${expected}" ]]; then
            echo "::error::Tag '${tag}' does not match package metadata '${expected}' (apps/desktop/package.json version + f1Release)"
            exit 1
          fi

          echo "Validated tag '${tag}' against package metadata '${expected}'"

  # ---------------------------------------------------------------------------
  # Build + validate (reusable workflow). Runs only after the metadata gate. The called workflow's
  # `validate`, `build-linux-x64` and `build-windows-x64` jobs must ALL succeed for this job to
  # succeed, and it uploads the `f1whisper-desktop-*` archives the publish job downloads.
  # ---------------------------------------------------------------------------
  build:
    name: Build and validate
    needs: verify-release-metadata
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Publish: gather platform archives, emit combined SHA256SUMS, create the Release.
  # Publication requires validation AND every advertised platform (Linux + Windows)
  # to succeed: `needs` lists all of them and there is no `always()` override, so a
  # failed validation or a missing platform artifact blocks the release entirely
  # rather than publishing an incomplete, unvalidated build.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-release-metadata, build]
    permissions:
      contents: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: f1whisper-desktop-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          echo "Release artifacts + checksums:"
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: F1Whisper Desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          # F1Whisper releases are full releases even when their upstream base version is beta.
          prerelease: false
          generate_release_notes: true
          body: |
            ## F1Whisper Desktop ${{ github.ref_name }}

            End-to-end-encrypted desktop client for the F1Whisper messaging service
            (AGPL fork of Threema for Desktop).

            Portable builds (no installer): extract the archive and run `F1WhisperDesktopLauncher`.
            Enter your F1Whisper activation credentials during onboarding to connect.

            Verify downloads against `SHA256SUMS`.

            Built from commit `${{ github.sha }}`.
          files: |
            dist/*
